; ExplorerBetterFileSizes
[config]

; Folder sizes
;   disabled      off
;   everything    from Everything
;   scan          walk the folder (slow on large folders)
;   scanWithShift walk the folder while Shift is held
folderSizeMode=disabled

; Mix files and folders when sorting by size: 1 yes, 0 no
mixFilesAndFoldersWhenSortingBySize=1

; Size units
;   system    Windows default
;   adaptive  MB/GB for large files
;   kb        KB only
fileSizeUnits=adaptive

; IEC units (KiB, MiB): 1 yes, 0 no
useIecTerms=0

; "B" instead of "bytes" below 1 KB: 1 yes, 0 no
bytesAsB=1
