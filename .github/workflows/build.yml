name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020
  LLVM_MINGW_SHA256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install llvm-mingw
        run: |
          curl -fsSLo "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0' }}
        run: make dist CC=x86_64-w64-mingw32-clang VERSION="${TAG#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExplorerBetterFileSizes-x64
          path: dist/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ExplorerBetterFileSizes-x64
          path: dist

      - name: Package
        run: cd dist && zip -r ../ExplorerBetterFileSizes-x64.zip .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ExplorerBetterFileSizes-x64.zip --repo "$GITHUB_REPOSITORY" --generate-notes
